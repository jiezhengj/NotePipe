name: Build and upload release assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the published tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and validate release files
        run: |
          npm run build
          npm run validate-release -- --tag "${{ github.event.release.tag_name }}"

      - name: Upload Obsidian plugin assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" main.js manifest.json styles.css --clobber
